<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Pop-up Question</title>
    
    <link rel="stylesheet" href="assets/css/quiz.css">
</head>
<body>

    <div class="popup-overlay">
        
        <div class="popup-container">
            
            <img src="uploads/quiz/banniere-quiz.jpg" alt="Illustration de la question" class="popup-banner">
            
            <div class="popup-content">
                
                <div class="question-container">
                    <span class="question-counter">Question 1/10</span>
                    <h2 class="question-text">Quelle est la question que tu souhaites poser à l'utilisateur ?</h2>
                </div>
                <div class="popup-actions">
                    <button class="quiz-btn">Vrai</button>
                    <button class="quiz-btn">Faux</button>
                </div>

            </div>

        </div>
    </div>

</body>
</html>
